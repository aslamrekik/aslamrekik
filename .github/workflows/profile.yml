name: Build profile dashboard

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # run it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "build_profile.py"
      - "icons.json"
      - "avatar-src.jpg"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboard and buttons
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 build_profile.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dashboard.svg btn-*.svg
          git commit -m "Update profile dashboard" || exit 0
          git push
